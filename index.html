<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TacitFlow AI 프로토타입</title>
<meta name="description" content="공공기관 순환보직 인수인계 AI TacitFlow의 인터랙티브 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: fixed left navigation + fluid workspace. Real-time screens sit on a simulated office-PC desktop stage. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --surface-3:#EDF0F5;
  --line:#E2E6EE; --line-2:#CFD6E2;
  --fg:#121826; --fg-2:#465065; --fg-3:#7A8498;
  --accent:#2E6BFF; --accent-2:#1D56E8; --accent-soft:#EAF0FF; --accent-ink:#1B47B5; --accent-line:#BCD0FF; --on-accent:#FFFFFF;
  --ok:#11885A; --ok-soft:#E3F4EB; --warn:#A86200; --warn-soft:#FFF2D9; --risk:#D0353B; --risk-soft:#FCE9EA;
  --shadow-1:0 1px 2px rgba(18,24,38,.05);
  --shadow-2:0 2px 6px rgba(18,24,38,.05),0 14px 34px rgba(18,24,38,.09);
  --glass:rgba(255,255,255,.82);
  --scrim:rgba(14,20,32,.38);
  --desk-1:#C7D5EC; --desk-2:#E8EEF7;
  --lg-win:#FAFAFA; --lg-bar:#3D4B5F; --lg-bar-fg:#FFFFFF; --lg-head:#E3E7EC; --lg-line:#B9C0CA; --lg-fg:#1E2329; --lg-field:#FFFFFF; --lg-btn:#E8EBEF; --lg-menu:#EFF1F4; --lg-sel:#DCE8FF;
  --paper:#FFFFFF; --paper-fg:#1B1E23; --paper-line:#3A3F47; --paper-head:#F1F3F6; --paper-hover:#F4F7FF; --paper-sel:#ECF2FF; --canvas:#E7EAF0;
  --art-1:#CFE0FF; --art-2:#8FB2FA; --art-3:#B9D0FF; --art-paper:#FFFFFF; --art-line:#D7E3FB; --art-hi:#FFFFFF;
  --mark:#FFF1B8;
  --font:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-w:236px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1119; --surface:#151A24; --surface-2:#1A202C; --surface-3:#222937;
    --line:#262E3D; --line-2:#344055;
    --fg:#E8ECF3; --fg-2:#AAB3C4; --fg-3:#7E889B;
    --accent:#3D74FF; --accent-2:#5A8BFF; --accent-soft:#17233D; --accent-ink:#A9C2FF; --accent-line:#2D4475; --on-accent:#FFFFFF;
    --ok:#46C98A; --ok-soft:#10291D; --warn:#F0B44E; --warn-soft:#2E220C; --risk:#FF7176; --risk-soft:#351619;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.4);
    --glass:rgba(22,28,40,.86);
    --scrim:rgba(0,0,0,.55);
    --desk-1:#1A2639; --desk-2:#2A374D;
    --lg-win:#22272E; --lg-bar:#0F141B; --lg-bar-fg:#E6E9ED; --lg-head:#2D333B; --lg-line:#46505B; --lg-fg:#D9DEE4; --lg-field:#1A1E24; --lg-btn:#353C45; --lg-menu:#2A3038; --lg-sel:#24385E;
    --paper:#F3F4F6; --paper-fg:#1B1E23; --paper-line:#3A3F47; --paper-head:#E6E9EE; --paper-hover:#EAF0FC; --paper-sel:#E1EAFB; --canvas:#0F141D;
    --art-1:#27467F; --art-2:#3C68C9; --art-3:#355DB3; --art-paper:#DCE6FA; --art-line:#AFC4EE; --art-hi:#9DB9F5;
    --mark:#5A4A12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1119; --surface:#151A24; --surface-2:#1A202C; --surface-3:#222937;
  --line:#262E3D; --line-2:#344055;
  --fg:#E8ECF3; --fg-2:#AAB3C4; --fg-3:#7E889B;
  --accent:#3D74FF; --accent-2:#5A8BFF; --accent-soft:#17233D; --accent-ink:#A9C2FF; --accent-line:#2D4475; --on-accent:#FFFFFF;
  --ok:#46C98A; --ok-soft:#10291D; --warn:#F0B44E; --warn-soft:#2E220C; --risk:#FF7176; --risk-soft:#351619;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.4);
  --glass:rgba(22,28,40,.86);
  --scrim:rgba(0,0,0,.55);
  --desk-1:#1A2639; --desk-2:#2A374D;
  --lg-win:#22272E; --lg-bar:#0F141B; --lg-bar-fg:#E6E9ED; --lg-head:#2D333B; --lg-line:#46505B; --lg-fg:#D9DEE4; --lg-field:#1A1E24; --lg-btn:#353C45; --lg-menu:#2A3038; --lg-sel:#24385E;
  --paper:#F3F4F6; --paper-fg:#1B1E23; --paper-line:#3A3F47; --paper-head:#E6E9EE; --paper-hover:#EAF0FC; --paper-sel:#E1EAFB; --canvas:#0F141D;
  --art-1:#27467F; --art-2:#3C68C9; --art-3:#355DB3; --art-paper:#DCE6FA; --art-line:#AFC4EE; --art-hi:#9DB9F5;
  --mark:#5A4A12;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%;max-width:100vw;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.muted{color:var(--fg-3)}
.mono{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.lg{height:46px;padding:0 20px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;color:var(--fg-2);position:relative}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--risk);border:2px solid var(--surface)}
.linkbtn{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--fg-2);white-space:nowrap;flex:none}
.pill .ic{width:13px;height:13px}
.pill.blue{background:var(--accent-soft);color:var(--accent-ink)}
.pill.solid{background:var(--accent);color:var(--on-accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.risk{background:var(--risk-soft);color:var(--risk)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--fg-2);font-weight:500}
.tag .ic{width:12px;height:12px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-weight:500;text-align:left}
.src:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.src .ic{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em;margin-bottom:6px}
.sec-k{font-size:12px;font-weight:700;color:var(--fg-3);letter-spacing:.04em;margin-bottom:8px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;padding:2px 6px}
.brand em{font-style:normal;color:var(--accent)}
.logo{flex:none;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:var(--surface-3)}
.seg button{height:32px;border-radius:7px;font-weight:700;font-size:13px;color:var(--fg-2)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-g{font-size:11.5px;font-weight:700;color:var(--fg-3);padding:12px 10px 6px;letter-spacing:.03em}
.nav a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:var(--fg-2);font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav a .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-guide{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--fg-2);padding:8px 10px;border-radius:9px;border:1px dashed var(--line-2)}
.side-guide:hover{color:var(--accent-ink);border-color:var(--accent-line)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.me b{display:block;font-size:13px}
.me small{display:block;font-size:11.5px;color:var(--fg-3)}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;flex:none}
.av.sm{width:30px;height:30px;font-size:12px}
.av.b{background:var(--fg-2);color:var(--surface)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:700}
.crumb .ic{width:14px;height:14px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;width:min(320px,34vw);padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-3)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--fg)}
.search:focus-within{border-color:var(--accent-line)}
.demo-pill{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
.menu{display:none}
.scrim{display:none}
.view{padding:22px 24px 120px;display:flex;flex-direction:column;gap:18px;min-width:0;max-width:100%}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;line-height:1.3}
.ph p{margin-top:4px;color:var(--fg-2);max-width:68ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* how-to strip */
.how{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:16px;align-items:center;padding:12px 14px 12px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.how-why{display:flex;gap:10px;align-items:baseline;min-width:0}
.how-tag{flex:none;font-size:11.5px;font-weight:800;color:var(--on-accent);background:var(--accent);padding:2px 8px;border-radius:6px}
.how-why p{font-weight:600;color:var(--accent-ink);font-size:13.5px}
.how-steps{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg-2);counter-reset:none}
.how-steps li{display:flex;align-items:center;gap:6px}
.how-steps b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--accent-ink);font-size:11px;border:1px solid var(--accent-line);flex:none}
.how-mini{align-self:flex-start;font-size:12px;font-weight:600;color:var(--accent-ink);display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--accent-soft)}

/* tour bar */
.tourbar{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-2);max-width:calc(100vw - 40px)}
.tb-k{font-size:12px;font-weight:800;color:var(--accent-ink);white-space:nowrap}
.tb-dots{display:flex;gap:5px}
.tb-dots a{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.tb-dots a.past{background:var(--accent-line)}
.tb-dots a.on{background:var(--accent);width:18px;border-radius:9px}
.tb-prev,.tb-next{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.tb-prev{color:var(--fg-2)}
.tb-prev:hover{background:var(--surface-3)}
.tb-next{background:var(--accent);color:var(--on-accent)}
.tb-next:hover{background:var(--accent-2)}
.tb-prev .ic,.tb-next .ic{width:15px;height:15px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.pad{padding:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .ic{color:var(--accent)}

/* ---------- home ---------- */
.hc{display:flex;flex-direction:column;gap:10px}
.hc .k{font-size:12px;font-weight:700;color:var(--fg-3)}
.hc h3{font-size:17px;font-weight:800}
.hc .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.hc .btn{align-self:flex-start;margin-top:4px}
.hc.hl{background:var(--accent-soft);border-color:var(--accent-line)}
.hc.hl h3{color:var(--accent-ink)}
.lst{display:flex;flex-direction:column}
.lst li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lst li:first-child{border-top:0}
.lst .t{flex:1;min-width:0}
.lst .t b{display:block;font-size:13.5px;font-weight:600}
.lst .t small{display:block;color:var(--fg-3);font-size:12px}
.date-chip{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);padding:5px 0;font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.toggle .sw{width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{left:19px}
.tool-tile{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.tool-tile:hover{border-color:var(--accent-line);background:var(--surface-2)}
.tool-tile .ti{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);flex:none}
.tool-tile b{display:block;font-size:14px}
.tool-tile small{display:block;font-size:12.5px;color:var(--fg-2)}

/* ---------- curriculum ---------- */
.srcs .s{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.srcs .s .si{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--surface-3);color:var(--fg-2);flex:none}
.srcs .s .st{flex:1;min-width:0}
.srcs .s b{display:block;font-size:13.5px}
.srcs .s small{display:block;font-size:12px;color:var(--fg-3)}
.srcs .s.hl{background:var(--accent-soft);border-color:var(--accent-line)}
.srcs .s.hl .si{background:var(--accent);color:var(--on-accent)}
.srcs .s.hl b{color:var(--accent-ink)}
.week{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.week.on{border:2px solid var(--accent);padding:17px;box-shadow:0 0 0 4px var(--accent-soft)}
.week-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week-h small{font-size:12px;font-weight:700;color:var(--accent-ink)}
.week h3{font-size:17px;font-weight:800}
.week .stage{font-size:12px;color:var(--fg-3);margin-top:-6px}
.wi{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--fg-2);text-align:left}
.wi:hover{background:var(--surface-2)}
.wi .ic{color:var(--fg-3)}
.wi.done .ic{color:var(--accent)}
.wi.now{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.wi.now .ic{color:var(--accent)}
.wi.lock{opacity:.6}
.wi-now{margin-left:auto;font-size:11px;font-weight:700}
.week .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.pipe span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:600}
.pipe .ic{width:14px;height:14px}
.pipe .arr{color:var(--fg-3)}
.case{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.case:hover{border-color:var(--accent-line)}
.case small{font-size:11.5px;font-weight:700;color:var(--accent-ink)}
.case b{font-size:14.5px}
.case p{font-size:12.5px;color:var(--fg-2)}
.case .f{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-3);margin-top:auto}
.case .f .ic{width:13px;height:13px}

/* ---------- lesson ---------- */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;counter-reset:st}
.steps li{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:18px}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:13px;flex:none;z-index:1}
.steps li::after{content:"";position:absolute;left:14.5px;top:30px;bottom:0;width:1px;background:var(--line-2)}
.steps li:last-child::after{display:none}
.steps li.weak::before{background:var(--warn);color:var(--surface)}
.steps li>div{flex:1;min-width:0}
.steps b{display:block;font-size:14.5px;margin-top:4px}
.steps p{font-size:13px;color:var(--fg-2);margin:3px 0 8px}
.weak-note{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px}
.memo{margin:0;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;color:var(--fg);line-height:1.65}
.memo cite{display:block;margin-top:8px;font-style:normal;font-size:12px;color:var(--fg-3)}
.laws li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.laws li:first-child{border-top:0}
.quiz{display:flex;flex-direction:column;gap:14px}
.qz b{display:block;font-size:14px;margin-bottom:8px}
.qz .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;text-align:left;width:100%;background:var(--surface)}
.opt:hover{border-color:var(--accent-line)}
.opt .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .r{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--risk);background:var(--risk-soft)}
.qres{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:600}
.qres.ok{background:var(--ok-soft);color:var(--ok)}
.qres.no{background:var(--warn-soft);color:var(--warn)}
.chatp{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.chatp .ch{padding:14px 16px;border-bottom:1px solid var(--line)}
.chatp .ch b{display:block;font-size:14.5px}
.chatp .ch small{font-size:12px;color:var(--fg-3)}
.cms{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.cm{max-width:92%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.cm.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.cm.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm.need{background:var(--warn-soft);border-color:transparent}
.cm-src{display:flex;flex-wrap:wrap;gap:5px}
.cm-link{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--accent-ink);font-size:12.5px}
.cm-link .ic{width:14px;height:14px}
.sugs{display:flex;flex-direction:column;gap:6px;padding:0 16px 10px}
.sug{text-align:left;font-size:12.5px;padding:8px 10px;border-radius:9px;border:1px dashed var(--accent-line);color:var(--accent-ink);background:var(--surface)}
.sug:hover{background:var(--accent-soft)}
.cin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.cin input{flex:1;min-width:0;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;font-size:13px}
.cin input:focus{outline:0;border-color:var(--accent)}

/* ---------- sandbox ---------- */
.sb{display:grid;grid-template-columns:232px minmax(0,1fr) 320px;gap:16px;align-items:start}
.sb-list{padding:14px;display:flex;flex-direction:column;gap:6px}
.sl{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;text-align:left;width:100%}
.sl:hover{background:var(--surface-2)}
.sl.on{background:var(--accent-soft)}
.sl-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-3);color:var(--fg-2);flex:none}
.sl.on .sl-ic{background:var(--accent);color:var(--on-accent)}
.sl-ic .ic{width:15px;height:15px}
.sl-t b{display:block;font-size:13px;line-height:1.4}
.sl.on .sl-t b{color:var(--accent-ink)}
.sl-t small{display:block;font-size:11.5px;color:var(--fg-3);margin-top:2px}
.sb-list-note{margin-top:8px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:11.5px;color:var(--fg-3);display:flex;gap:6px}
.sb-list-note .ic{width:14px;height:14px;margin-top:2px}
.sb-main{display:flex;flex-direction:column;min-height:620px}
.sb-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-h b{font-size:15.5px}
.sb-h-ic{color:var(--accent);display:grid}
.call{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--fg-2);font-variant-numeric:tabular-nums}
.call .rec{width:14px;height:14px;color:var(--risk)}
.sb-brief{padding:12px 18px;font-size:13px;color:var(--fg-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.sb-brief b{color:var(--fg);margin-right:4px}
.sb-crit{display:block;margin-top:4px;font-size:12px;color:var(--fg-3)}
.sb-log{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:78%}
.msg .who{font-size:11.5px;color:var(--fg-3);font-weight:600}
.msg p{padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
.msg.them p{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);border-top-left-radius:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me p{background:var(--accent-soft);color:var(--fg);border-top-right-radius:4px}
.hints{margin:0 18px;display:flex;flex-direction:column;gap:6px}
.hints p{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:12.5px;color:var(--fg)}
.hints .ic{width:15px;height:15px;color:var(--warn);margin-top:2px}
.sb-comp{margin:14px 18px 18px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.fld label{font-size:12.5px;font-weight:600;color:var(--fg-2);padding-top:9px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:8px 11px;font-size:13.5px;resize:vertical;line-height:1.55}
.fld input{height:38px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sb-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sb-fb{padding:16px;display:flex;flex-direction:column;gap:14px}
.fb-h b{display:block;font-size:15px}
.fb-h small{font-size:12px;color:var(--fg-3)}
.fb-l{display:flex;flex-direction:column;gap:8px}
.fb-l li{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.fb-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.fb-row b{flex:1;font-weight:600}
.fb-l li.ok .fb-row .ic{color:var(--ok)}
.fb-l li.miss,.fb-l li.part{border-color:var(--accent-line);background:var(--accent-soft)}
.fb-l li.miss .fb-row .ic,.fb-l li.part .fb-row .ic{color:var(--accent)}
.fb-l.pre li .ic{color:var(--fg-3)}
.fb-fix{margin-top:8px;padding-top:8px;border-top:1px solid var(--accent-line);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fb-fix-k{font-size:11.5px;font-weight:800;color:var(--accent-ink)}
.fb-fix p{font-size:12.5px;color:var(--fg)}
.fb-score-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.fb-score-h b{color:var(--accent-ink)}
.fb-done{display:flex;gap:8px;padding:12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:600}
.fb-next{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);text-align:left;width:100%}
.fb-next:hover{border-color:var(--accent-line)}
.fb-next span{flex:1}
.fb-next small{display:block;font-size:11.5px;color:var(--fg-3)}
.fb-next b{font-size:13.5px}
.fb-note{font-size:11.5px;color:var(--fg-3)}
.fb-empty{font-size:12.5px;color:var(--fg-2);padding:12px;border-radius:10px;background:var(--surface-2)}

/* ---------- templates ---------- */
.tp{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:16px;align-items:start}
.tp-list{padding:14px;display:flex;flex-direction:column;gap:4px}
.tl{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;text-align:left;width:100%}
.tl:hover{background:var(--surface-2)}
.tl.on{background:var(--accent-soft)}
.tl .ic{color:var(--fg-3);margin-top:1px}
.tl.on .ic{color:var(--accent)}
.tl b{display:block;font-size:13px}
.tl.on b{color:var(--accent-ink)}
.tl small{display:block;font-size:11.5px;color:var(--fg-3)}
.tp-doc{display:flex;flex-direction:column;overflow:hidden}
.tp-doc-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tp-doc-h b{font-size:13.5px}
.tp-meta{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px;font-size:12px;color:var(--fg-3);border-bottom:1px solid var(--line)}
.tp-canvas{background:var(--canvas);padding:26px 18px;overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-fg);width:100%;max-width:640px;min-width:480px;margin:0 auto;padding:42px 44px 48px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.12);border-radius:2px;font-size:13px}
.paper h3{text-align:center;letter-spacing:.55em;font-size:22px;font-weight:800;margin:0 0 24px;text-indent:.55em}
.doc-t{width:100%;border-collapse:collapse}
.doc-t th,.doc-t td{border:1px solid var(--paper-line);padding:9px 10px;vertical-align:middle;line-height:1.5}
.doc-t th{width:82px;background:var(--paper-head);font-weight:700;text-align:center;font-size:12.5px}
.doc-t td.f{cursor:pointer;position:relative}
.doc-t td.f:hover{background:var(--paper-hover)}
.doc-t td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--paper-sel)}
.doc-t td.err{outline:2px solid var(--risk);outline-offset:-2px}
.doc-t td.wrn{outline:2px dashed var(--warn);outline-offset:-2px}
.cellv{margin-right:6px}
.fchip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:#E6EEFF;color:#1B47B5;vertical-align:1px}
.fchip.need{background:#FFF0D1;color:#8A5200;border:1px dashed #C98A20}
.paper .sign{margin-top:22px;text-align:center;font-size:13px}
.paper .sign-row{display:flex;justify-content:flex-end;gap:28px;margin-top:16px;font-size:12.5px}
.ins{background:var(--mark);border-radius:3px;padding:0 2px}
.tp-side{padding:16px;display:flex;flex-direction:column;gap:12px}
.tp-side-h b{display:block;font-size:15px}
.tp-side-h small{font-size:12px;color:var(--fg-3)}
.prog-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.prog-h b{color:var(--accent-ink)}
.fc{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fc.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fc.err{border-color:var(--risk)}
.fc.wrn{border-color:var(--warn)}
.fc-h{display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.fc-h b{flex:1;font-size:13px}
.fc-v{font-size:12.5px;color:var(--fg-2)}
.fc-src{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-3)}
.fc-src .ic{width:12px;height:12px}
.fc input,.fc textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:7px 10px;font-size:13px;resize:vertical}
.fc input:focus,.fc textarea:focus{outline:0;border-color:var(--accent)}
.fc-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc-warn{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--warn-soft);color:var(--fg);font-size:12px}
.fc-warn .ic{width:14px;height:14px;color:var(--warn)}
.issues{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--risk-soft)}
.issues b{font-size:13px;color:var(--risk)}
.issue{display:flex;align-items:center;gap:8px;font-size:12.5px}
.issue span{flex:1}
.issue .ic{width:14px;height:14px}
.issue.err .ic{color:var(--risk)}
.issue.warn .ic{color:var(--warn)}
.flow-steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--fg-3)}
.flow-steps span{padding:3px 8px;border-radius:6px;background:var(--surface-3)}
.flow-steps span.done{background:var(--accent-soft);color:var(--accent-ink)}
.flow-steps span.cur{background:var(--accent);color:var(--on-accent)}
.flow-steps .ic{width:12px;height:12px}
.tp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp-actions .btn{width:100%}
.tp-note{font-size:11.5px;color:var(--fg-3)}

/* ---------- records ---------- */
.rc{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.rc-filters{display:flex;gap:6px;flex-wrap:wrap}
.fchipb{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--fg-2);background:var(--surface)}
.fchipb.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.rc-list{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
.ri:hover{border-color:var(--accent-line)}
.ri.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ri .rt{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3)}
.ri b{font-size:14px}
.ri.locked{background:var(--surface-2);color:var(--fg-3);cursor:not-allowed}
.ri.new{border-style:dashed;border-color:var(--ok)}
.rd{padding:20px;display:flex;flex-direction:column;gap:16px}
.rd h2{font-size:20px;font-weight:800}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 16px;font-size:13.5px}
.kv dt{color:var(--fg-3);font-weight:600;font-size:12.5px;padding-top:1px}
.kv dd{margin:0}
.kv ol{list-style:decimal;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ver{display:flex;flex-direction:column;gap:8px}
.ver-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.ver-bar{height:12px;border-radius:99px;background:var(--surface-3);position:relative;overflow:hidden}
.ver-bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.ver-bar i.old{background:var(--line-2)}
.ver-bar i.cur{background:var(--accent)}
.ver-axis{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.ver-axis div{display:flex;justify-content:space-between}

/* ---------- desktop stage (real-time) ---------- */
.stage{position:relative;border-radius:18px;background:linear-gradient(135deg,var(--desk-1),var(--desk-2));padding:18px 18px 58px;border:1px solid var(--line);overflow:hidden}
.stage-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stage-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--glass);color:var(--fg-2);border:1px solid var(--line)}
.stage-label .ic{width:14px;height:14px}
.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:42px;display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);font-size:12px;color:var(--fg-2)}
.taskbar .tk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px}
.taskbar .tk.on{background:var(--surface);box-shadow:var(--shadow-1);color:var(--fg);font-weight:600}
.taskbar .tk .ic{width:15px;height:15px}
.taskbar .clock{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lwin{position:relative;background:var(--lg-win);border:1px solid var(--lg-line);border-radius:6px;box-shadow:var(--shadow-2);font-size:13px;color:var(--lg-fg);overflow:hidden;min-width:0}
.lwin-bar{background:var(--lg-bar);color:var(--lg-bar-fg);height:30px;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:8px}
.lwin-bar .wb{margin-left:auto;display:flex;gap:10px;opacity:.75;font-family:var(--mono)}
.lwin-menu{background:var(--lg-menu);border-bottom:1px solid var(--lg-line);display:flex;gap:16px;padding:5px 12px;font-size:12px;flex-wrap:wrap}
.lwin-menu span.on{font-weight:700;text-decoration:underline}
.lwin-body{padding:14px;overflow-x:auto}
.lwin-title{font-size:14px;font-weight:700;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--lg-bar)}
.ltable{width:100%;border-collapse:collapse;min-width:440px}
.ltable th{background:var(--lg-head);border:1px solid var(--lg-line);padding:8px 10px;text-align:left;width:132px;font-weight:600;font-size:12.5px;vertical-align:middle}
.ltable td{border:1px solid var(--lg-line);padding:7px 10px;vertical-align:middle}
.lf{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px;border-radius:4px}
.lf input,.lf select{height:28px;border:1px solid var(--lg-line);background:var(--lg-field);color:var(--lg-fg);border-radius:2px;padding:0 6px;font-size:12.5px}
.lf input[type="text"]{width:min(320px,100%)}
.lf .fname{font-size:12px;font-family:var(--mono)}
.lbtn{height:28px;padding:0 12px;border:1px solid var(--lg-line);background:var(--lg-btn);color:var(--lg-fg);border-radius:2px;font-size:12.5px;white-space:nowrap}
.lbtn:hover{filter:brightness(.97)}
.lbtn.pri{background:var(--lg-bar);color:var(--lg-bar-fg);border-color:var(--lg-bar)}
.lacts{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.tf-focus{outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 7px rgba(46,107,255,.18);animation:tfpulse 1.8s ease-in-out infinite}
.tf-recheck{outline:2px dashed var(--warn);outline-offset:3px}
@keyframes tfpulse{0%,100%{box-shadow:0 0 0 5px rgba(46,107,255,.18)}50%{box-shadow:0 0 0 10px rgba(46,107,255,.06)}}
.tf-brow td{border:0!important;padding:4px 0 10px!important;background:transparent}
.tf-bubble{position:relative;margin-left:132px;background:var(--surface);color:var(--fg);border:1px solid var(--accent-line);border-radius:12px;box-shadow:var(--shadow-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px;max-width:460px}
.tf-bubble::before{content:"";position:absolute;top:-7px;left:26px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--accent-line);border-top:1px solid var(--accent-line);transform:rotate(45deg)}
.tf-b-h{display:flex;align-items:center;gap:8px}
.tf-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--on-accent);background:var(--accent);padding:2px 7px;border-radius:6px}
.tf-badge .ic{width:12px;height:12px}
.tf-b-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.src-s{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--fg-3)}
.src-s .ic{width:12px;height:12px}
.tf-note{font-size:12px;padding:7px 9px;border-radius:8px;background:var(--warn-soft);color:var(--fg)}
.dock{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dock-h{display:flex;align-items:center;gap:8px}
.dock-h b{font-size:14px;flex:1}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ok)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.live.off{color:var(--fg-3)}
.dock-sub{font-size:12px;color:var(--fg-3)}
.gsteps{display:flex;flex-direction:column;gap:4px}
.gsteps button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:13px}
.gsteps button:hover{background:var(--surface-3)}
.gsteps b{display:block;font-weight:600}
.gsteps small{display:block;font-size:11.5px;color:var(--warn);font-weight:600}
.gsteps .ic{margin-top:1px;color:var(--fg-3)}
.gsteps .done .ic{color:var(--accent)}
.gsteps .now button{background:var(--accent-soft)}
.gsteps .now b{color:var(--accent-ink);font-weight:800}
.gsteps .now .ic{color:var(--accent)}
.gsteps .recheck .ic{color:var(--warn)}
.dock-actions{display:flex;gap:6px;flex-wrap:wrap}
.dock-note{font-size:11.5px;color:var(--fg-3);border-top:1px solid var(--line);padding-top:10px}
.manual li label{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;font-size:13px}
.manual input{margin-top:3px;accent-color:var(--accent)}
.tf-fail{position:absolute;inset:30px 0 0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:5}
.tf-fail .box{background:var(--surface);color:var(--fg);border-radius:14px;padding:18px;max-width:360px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:10px}
.tf-fail .box b{font-size:15px}
.tf-fail .box p{font-size:13px;color:var(--fg-2)}
.tf-fail .row{display:flex;gap:6px;flex-wrap:wrap}
.lmodal{position:absolute;inset:30px 0 0;background:rgba(0,0,0,.25);display:grid;place-items:center;z-index:4;padding:12px}
.lmodal .lwin{width:min(420px,100%)}

/* widget (floating) */
.wstage{position:relative}
.wdoc{margin-right:368px}
.editor{background:var(--paper);color:var(--paper-fg);margin:0 auto;max-width:620px;padding:28px 32px;min-height:340px;font-size:13.5px;line-height:1.9;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.editor .er{display:grid;grid-template-columns:56px 1fr;gap:6px}
.editor .er b{font-weight:700}
.editor .in{padding-left:18px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--paper-fg);vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.fw{position:absolute;top:0;right:0;width:350px;z-index:6}
.fw-pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 8px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow-2);font-weight:700;font-size:13px;float:right}
.fw-panel{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;max-height:640px}
.fw-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fw-h b{flex:1;font-size:14px}
.fw-ctx{padding:8px 14px;font-size:11.5px;color:var(--fg-3);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.fw-ctx .ic{width:13px;height:13px}
.fw-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.ans{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.ans.need{border-color:var(--warn)}
.ans-k{font-size:11.5px;font-weight:800;color:var(--fg-3);letter-spacing:.03em}
.ans-row{display:flex;align-items:center;gap:8px}
.ans-main{font-weight:600;line-height:1.55}
.ans-cond li{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:2px 0}
.ans-cond .ic{width:14px;height:14px;margin-top:3px;color:var(--ok)}
.ans-cond .q .ic{color:var(--warn)}
.ans-src{display:flex;flex-direction:column;gap:5px}
.ans-act{display:flex;gap:6px;flex-wrap:wrap}
.preview{padding:10px;border-radius:10px;background:var(--accent-soft);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.preview q{quotes:none;font-weight:600;color:var(--fg)}

/* alert */
.lgrid{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.lgrid th{background:var(--lg-head);border:1px solid var(--lg-line);padding:6px 8px;text-align:left;font-weight:600}
.lgrid td{border:1px solid var(--lg-line);padding:6px 8px;font-family:var(--mono);font-size:11.5px}
.lgrid td.k{font-family:var(--font);font-size:12px}
.dlg-body{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.dlg-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center}
.dlg-row input[type="text"],.dlg-row input[type="password"],.dlg-row select{height:28px;border:1px solid var(--lg-line);background:var(--lg-field);color:var(--lg-fg);border-radius:2px;padding:0 6px;font-size:12px;width:100%}
.dlg-row label.ck{display:flex;gap:6px;align-items:center}
.alert-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);overflow:hidden;display:flex;flex-direction:column}
.alert-top{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--risk-soft);color:var(--risk)}
.alert-top b{font-size:13px;flex:1}
.alert-top.mid{background:var(--warn-soft);color:var(--warn)}
.alert-top.done{background:var(--ok-soft);color:var(--ok)}
.alert-body{padding:14px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.alert-body h4{font-size:15px;line-height:1.45}
.ab-k{font-size:11.5px;font-weight:800;color:var(--fg-3);margin-bottom:4px}
.chk li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk .ic{width:16px;height:16px;margin-top:2px;color:var(--fg-3)}
.chk li.ok .ic{color:var(--ok)}
.chk li.unk .ic{color:var(--warn)}
.chk small{display:block;font-size:11.5px;color:var(--fg-3)}
.alert-foot{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.alog li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.alog li:first-child{border-top:0}
.alog .mono{color:var(--fg-3);flex:none}
.focus-hl{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- senior: check-in ---------- */
.os-toast{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);max-width:460px}
.os-toast b{display:block;font-size:13.5px}
.os-toast small{font-size:12px;color:var(--fg-3)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.files{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow.on{background:var(--accent-soft)}
.fname-b{display:flex;gap:10px;align-items:center;text-align:left;min-width:0}
.fname-b .ft{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:10px;font-weight:800;font-family:var(--mono);background:var(--surface-3);color:var(--fg-2);flex:none;text-transform:uppercase}
.fname-b b{display:block;font-size:13px;font-weight:600}
.fname-b small{display:block;font-size:11.5px;color:var(--fg-3)}
.fcls{display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:12px;color:var(--fg-2)}
.dec{display:flex;gap:3px;padding:3px;border-radius:9px;background:var(--surface-3)}
.dec button{height:28px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;color:var(--fg-2);position:relative;white-space:nowrap}
.dec button.rec::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dec button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.dec button.on.approve,.dec button.on.mask{color:var(--accent-ink)}
.dec button.on.exclude{color:var(--risk)}
.dec button.on.hold{color:var(--warn)}
.ci-side{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.excerpt{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;line-height:1.8}
.pii{background:var(--risk-soft);color:var(--risk);border-radius:4px;padding:0 3px;font-weight:600}
.pii.m{background:var(--fg);color:var(--surface);font-family:var(--mono);font-size:11.5px}
.ci-sum{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2)}
.ci-sum .cnt{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.ci-sum .cnt b{color:var(--fg);font-variant-numeric:tabular-nums}
.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.result .r{padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.result .r b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.result .r small{font-size:12px;color:var(--fg-2)}

/* capture */
.cp{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.mini-scr{border:1px solid var(--lg-line);border-radius:6px;background:var(--lg-win);color:var(--lg-fg);overflow:hidden;font-size:12px;position:relative}
.ms-bar{background:var(--lg-bar);color:var(--lg-bar-fg);padding:6px 10px;font-size:11.5px}
.ms-body{padding:12px;display:flex;flex-direction:column;gap:6px}
.ms-row{display:grid;grid-template-columns:110px minmax(0,1fr);border:1px solid var(--lg-line)}
.ms-row span{padding:7px 8px}
.ms-row span:first-child{background:var(--lg-head);font-weight:600}
.ms-row.hit{outline:2px solid var(--risk);outline-offset:1px;position:relative}
.click-dot{position:absolute;right:14px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:3px solid var(--risk);background:rgba(208,53,59,.15)}
.blur{filter:blur(4px);user-select:none}
.mask-tag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--surface);background:var(--fg);padding:1px 6px;border-radius:5px;filter:none}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fr{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:12px;min-width:0}
.fr:hover{border-color:var(--accent-line)}
.fr.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fr small{font-family:var(--mono);color:var(--fg-3);font-size:11px}
.fr b{font-size:12.5px;line-height:1.4}
.fr.ghost{border-style:dashed;color:var(--fg-3);background:var(--surface-2)}
.shimmer{background:linear-gradient(90deg,var(--surface-3),var(--surface),var(--surface-3));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.pcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard h3{font-size:16px}
.pc-steps{display:flex;flex-direction:column;gap:8px;counter-reset:pc}
.pc-steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:12.5px}
.pc-steps li::before{counter-increment:pc;content:counter(pc);display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--surface-3);font-weight:800;font-size:11.5px}
.pc-steps b{display:block;font-size:13px}
.pc-steps small{display:block;color:var(--fg-3)}
.pcard textarea{width:100%;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:8px 10px;font-size:13px;resize:vertical}
.pcard textarea:focus{outline:0;border-color:var(--accent)}
.state{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:12.5px}
.state.wait{background:var(--warn-soft)}
.state.ok{background:var(--ok-soft)}
.state .ic{width:16px;height:16px;margin-top:2px}
.state.wait .ic{color:var(--warn)}
.state.ok .ic{color:var(--ok)}

/* review */
.rv{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.rv-i{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.rv-i:hover{border-color:var(--accent-line)}
.rv-i.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rv-i b{font-size:13.5px}
.rv-i small{font-size:11.5px;color:var(--fg-3)}
.rv-i .rt{display:flex;gap:6px;align-items:center}
.rv-d{padding:20px;display:flex;flex-direction:column;gap:14px}
.rv-d h2{font-size:19px;font-weight:800}
.found{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;display:flex;gap:8px}
.found .ic{width:16px;height:16px;color:var(--warn);margin-top:2px}
.rv-d textarea,.rv-d select{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:13.5px;resize:vertical}
.rv-d select{height:40px;padding:0 10px}
.rv-d textarea:focus,.rv-d select:focus{outline:0;border-color:var(--accent)}

/* sheet + toast */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:80}
.sheet{position:fixed;z-index:81;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-2);border:1px solid var(--line)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header b{flex:1;font-size:15px}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.75}
.sheet-body .meta{font-size:12px;color:var(--fg-3)}
.sheet-body .doc{padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sheet-body mark{background:var(--fg);color:var(--surface);border-radius:4px;padding:0 4px;font-size:12px}
.toasts{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 32px))}
.toast{display:flex;gap:8px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--fg);color:var(--surface);font-size:13px;font-weight:600;box-shadow:var(--shadow-2);animation:tin .25s ease;pointer-events:auto}
.toast .ic{width:16px;height:16px;margin-top:1px}
.toast.ok .ic{color:var(--ok)}
.toast.warn .ic{color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* ---------- tour (landing) ---------- */
.tour{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:0 80px}
.t-nav{display:flex;align-items:center;gap:16px;padding-block:20px;flex-wrap:wrap}
.t-nav-sub{font-size:13px;color:var(--fg-3);font-weight:600}
.t-nav .btn{margin-left:auto}
.t-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:36px 56px}
.t-copy h1{font-size:clamp(38px,5.4vw,66px);font-weight:900;line-height:1.12;letter-spacing:-.045em}
.t-en{font-size:clamp(18px,2vw,24px);font-weight:800;margin-top:18px;letter-spacing:-.02em}
.t-lead{margin-top:10px;font-size:16px;color:var(--fg-2);max-width:46ch;line-height:1.7}
.t-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.t-note{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--fg-3)}
.t-note .ic{width:14px;height:14px}
.art{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.9fr);align-items:center;gap:8px}
.art-folder{width:100%;max-width:340px;height:auto;filter:drop-shadow(0 18px 30px rgba(46,107,255,.22))}
.art-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--accent);font-size:11.5px;font-weight:700}
.art-arrow .ic{width:34px;height:34px}
.art-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-2);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ac-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ac-h b{font-size:14px}
.ac-l{display:flex;flex-direction:column;gap:12px;position:relative}
.ac-l::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--accent-line)}
.ac-l li{position:relative;padding-left:20px}
.ac-l i{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.ac-l small{display:block;font-size:11px;font-weight:700;color:var(--accent-ink)}
.ac-l b{display:block;font-size:13px;line-height:1.4}
.ac-f{font-size:11px;color:var(--fg-3);border-top:1px solid var(--line);padding-top:8px}
.art-tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;padding-left:10%}
.art-tags span{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.t-sec{padding-block:44px;border-top:1px solid var(--line)}
.t-sec-h{margin-bottom:22px}
.t-sec-h h2{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.3}
.t-sec-h p{margin-top:8px;color:var(--fg-2);max-width:62ch}
.t-gap{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.2fr);gap:18px;align-items:stretch}
.gap-col{padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.gap-col h3{display:flex;align-items:center;gap:8px;font-size:16px}
.gap-col h3 .ic{color:var(--fg-3)}
.gap-col.lost{background:var(--accent-soft);border-color:var(--accent-line)}
.gap-col.lost h3 .ic{color:var(--accent)}

.scr .si{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-3);color:var(--fg-2);flex:none}
.scr:hover .si{background:var(--accent);color:var(--on-accent)}
.scr .st{flex:1;min-width:0}
.scr b{display:block;font-size:13.5px}
.scr small{display:block;font-size:12px;color:var(--fg-3)}
.scr .tok{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:fl}

.flow li:last-child{background:var(--accent-soft);border-color:var(--accent-line)}

    a.st = 'answered'; a.a = txt;
    SRC['ans' + a.id] = { t: '선임자 답변 · ' + a.q, meta: '2026.10.11 · 주무관 B 승인 · 근거: ' + (S.rv.basis[a.id] || '결재 문서 연결'), body: `<p>${esc(txt)}</p>` };
    RECORDS.unshift({ id: 'n' + a.id, isNew: true, type: '민원 대응', t: a.q, prob: a.q, why: '후임자 질문에 선임자가 답한 내용', how: [txt], exc: '기관 규정이 바뀌면 다시 검토', src: [['ans' + a.id, '선임자 답변 (2026.10.11)']], dept: '복지정책과', rev: '2026.10.11', acl: '기초생활보장 담당' });
    toast('승인된 답변을 업무 기록에 추가했습니다 · 후임자에게 알렸습니다'); update();
  },
  rvForward() { const a = REVIEWS.find(r => r.id === S.rv.a); a.st = 'forwarded'; toast('팀 담당자에게 넘겼습니다', 'info'); update(); },
};
function wQuestion(q) {
  const W = S.w;
  W.msgs.push({ w: 'me', x: q });
  if (/대리|위임|가족/.test(q)) { W.msgs.push({ w: 'bot', k: 'clar' }); W.phase = 'clar'; }
  else if (/수수료|면제/.test(q)) { W.msgs.push({ w: 'bot', k: 'a1' }); if (W.phase === 'start') W.phase = 'a1'; }
  else W.msgs.push({ w: 'bot', k: 'gen' });
  update();
  const n = $('#wIn'); if (n) n.focus();
}

/* inputs that must not re-render (keep focus) */
const IN = {
  sbLaw(t) { S.sb[S.sb.active].law = t.value; },
  sbAns(t) { S.sb[S.sb.active].answer = t.value; },
  tplV(t) {
    const k = t.dataset.k, T = S.tpl;
    if (k === 'people') { T.v.people[+t.dataset.i] = t.value; const c = $('#cell-p' + t.dataset.i); if (c) c.textContent = t.value; }
    else { T.v[k] = t.value; const c = $('#cell-' + k); if (c) c.innerHTML = cellText(k); }
    if (T.status !== 'draft') { T.status = 'draft'; const s = $('#tplStatus'); if (s) s.innerHTML = tplStatusHTML(); }
  },
  alPwv(t) { S.al.pwv = t.value; },
  cpEx(t) { S.cp.ex = t.value; },
  rvAns(t) { S.rv.draft[S.rv.a] = t.value; },
};
const CH = {
  gSel(t) {
    const G = S.g, k = t.dataset.k; G.v[k] = t.value;
    if (k === 'method' && t.value !== '적격심사') G.v.crit = '';
    const i = GSTEPS.findIndex(s => s.k === k);
    if (G.st[i] === 'done' && !gValid(i)) G.st[i] = 'recheck';
    G.early = ''; update();
  },
  gPrice(t) {
    const G = S.g; const n = parseInt(t.value.replace(/[^0-9]/g, ''), 10) || 0; G.v.price = n.toLocaleString('ko-KR');
    if (G.st[1] === 'done' || G.v.region) { if (G.v.region !== recRegion()) { if (G.st[1] === 'done') G.st[1] = 'recheck'; toast('추정가격이 바뀌어 지역 제한을 다시 확인해야 합니다', 'warn'); } }
    update();
  },
  gMc(t) { S.g.mc[+t.dataset.i] = t.checked; },
  alPw(t) { S.al.pw = t.checked; if (!t.checked) S.al.pwv = ''; S.al.hl = ''; S.focus = t.checked ? '#alPwv' : null; update(); },
  alFolder(t) { S.al.folder = t.value; S.al.hl = ''; update(); },
  rvBasis(t) { S.rv.basis[S.rv.a] = t.value; },
  tplDate() { if (S.tpl.issues) { S.tpl.issues = tplCheck(); if (!S.tpl.issues.length) S.tpl.issues = null; } update(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = A[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && IN[t.dataset.in]) IN[t.dataset.in](t); });
document.addEventListener('change', e => { const t = e.target.closest('[data-ch]'); if (t && CH[t.dataset.ch]) CH[t.dataset.ch](t); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#sheet-root').innerHTML) closeSheet(); else if (S.sideOpen) { S.sideOpen = false; update(); } return; }
  if (e.key === 'Enter' && !e.isComposing) { const t = e.target.closest('[data-enter]'); if (t && A[t.dataset.enter]) { e.preventDefault(); A[t.dataset.enter](t); } }
});
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
